services:
  marzban:
    image: gozargah/marzban:latest
    restart: always
    env_file: .env
    network_mode: host
    # NET_ADMIN: the ip-limit backstop kills excess addresses' established
    # sessions with `ss --kill`; without it the main host is monitor-only.
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/lib/marzban:/var/lib/marzban
