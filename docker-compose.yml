services:
  marzban:
    image: gozargah/marzban:latest
    restart: always
    env_file: .env
    network_mode: host
    # NET_ADMIN: the ip-limit backstop firewalls excess addresses (iptables
    # MARZBAN_IPLIMIT chain); without it the main host is monitor-only.
    cap_add:
      - NET_ADMIN
    volumes:
      - /var/lib/marzban:/var/lib/marzban
